# RangerPPTX's Rust-syntax modules (src/lib.rs), compiled by Ranger like the
# .rgr files and checkable with cargo. Paths are those of the checkout layout
# <Ranger>/gallery/pptx that every build uses.
[package]
name = "pptx"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
ranger = { path = "../../runtime/rust/ranger" }
